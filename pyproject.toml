[project]
name = "social-lurker"
version = "0.3.3"
description = "盯梢者：Grok Bot 的新发布动态监测与四字段通知"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
social-lurker = "social_lurker.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
