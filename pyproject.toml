[project]
name = "social-lurker"
version = "0.2.0"
description = "盯梢者：Grok Bot 的社交作品全文资料库与通知工具"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "python-dotenv==1.2.2"]

[project.scripts]
social-lurker = "social_lurker.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
