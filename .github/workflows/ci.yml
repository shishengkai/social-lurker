name: Local contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check install.py src tests tools
      - run: uv run pytest -q
      - name: Install, repeat and add a second Bot
        run: uv run python tools/smoke_install.py
      - name: Verify lock export
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o /tmp/requirements-runtime.txt && diff requirements-runtime.txt /tmp/requirements-runtime.txt
  bootstrap:
    runs-on: ubuntu-latest
    container: python:3.9-slim-bookworm@sha256:a02e9c5406c416c504d6c9a1a306ff4080c3173f1008d192f953bd20382a2d5c
    steps:
      - name: Prepare source checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Trust this runner checkout inside the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
      - name: Bootstrap missing Python, Node and media tools
        run: python tools/smoke_install.py
