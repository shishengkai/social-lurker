name: Lightweight R1 contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --frozen --group dev
      - run: uv run ruff check install.py src tests tools
      - run: uv run ruff format --check install.py src tests tools
      - run: uv run pytest -q
      - run: uv run python tools/smoke_install.py
      - name: Build pinned package without publishing
        run: uv run python tools/build_release.py --output /tmp/social-lurker-release
